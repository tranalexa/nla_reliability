[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nla"]

[project]
name = "nla-reliability"
version = "0.1.0"
description = "NLA reliability pipeline: extract Gemma activations, sample AV descriptions on Modal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
    "httpx>=0.28.1",
    "huggingface-hub>=1.16.1",
    "matplotlib>=3.9",
    "modal>=0.73",
    "numpy>=2.4.6",
    "orjson>=3.11.9",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "safetensors>=0.7.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch>=2.12.0",
    "transformers>=4.49",
]
